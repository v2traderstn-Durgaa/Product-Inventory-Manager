kind = "web"
previewPath = "/"
title = "Angaayam Foods"
version = "1.0.0"
id = "artifacts/angaayam"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19210

[services.development]
run = "pnpm --filter @workspace/angaayam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/angaayam", "run", "build" ]
publicDir = "artifacts/angaayam/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19210"
BASE_PATH = "/"
